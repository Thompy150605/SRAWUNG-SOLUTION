name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps > npm.log 2>&1 || { tail -n 25 npm.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Build
        run: |
          npm run build > build.log 2>&1 || { tail -n 25 build.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          cat build.log
        env:
          GITHUB_PAGES: 'true'

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
